<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Gastos do dia a dia</title>
<meta name="theme-color" content="#1E2A1F">
<link rel="manifest" href="./manifest.json">
<link rel="apple-touch-icon" href="./icon-apple-touch.png">
<link rel="icon" href="./icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#E7EEE1;
    --ink:#1E2A1F;
    --ink-soft:#5C6B57;
    --ink-faint:#8A9784;
    --rule:#C4D4BB;
    --rule-strong:#9CB491;
    --debit:#9B3A2E;
    --credit:#3E6B4E;
    --white:#FDFCF9;

    --cat-cachaca:#9B3A2E;
    --cat-mercado:#3E6B4E;
    --cat-comidafora:#C9862A;
    --cat-bets:#6B3E86;
    --cat-lavanderia:#3E7A8C;
    --cat-gata:#C23B6E;
    --cat-coletas:#7A6A4E;
    --cat-saude:#2E7D6B;
    --cat-hydro:#8C6A3E;
    --cat-outros:#8A9784;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{
    margin:0; padding:0; height:100%;
    background:var(--ink);
    font-family:'IBM Plex Sans', sans-serif;
    color:var(--ink);
    overscroll-behavior:none;
    touch-action:manipulation;
  }
  #ga-root{
    max-width:480px; margin:0 auto; min-height:100vh;
    background:var(--paper);
    display:flex; flex-direction:column;
    padding-bottom:calc(24px + env(safe-area-inset-bottom));
    position:relative;
    user-select:none;
  }
  #ga-root input, #ga-root textarea, #ga-root select{ user-select:text; }

  .month-nav{
    display:flex; align-items:center; justify-content:space-between;
    padding:calc(14px + env(safe-area-inset-top)) 18px 8px;
  }
  .month-nav button{
    background:none; border:none; color:var(--ink-soft);
    font-size:20px; padding:6px 10px; cursor:pointer; touch-action:manipulation;
  }
  .month-nav .month-label{
    font-family:'IBM Plex Mono', monospace; font-weight:600;
    letter-spacing:1px; text-transform:uppercase; font-size:13px; color:var(--ink-soft);
  }

  .total-hero{
    text-align:center; padding:6px 18px 18px;
  }
  .total-hero .amount{
    font-family:'IBM Plex Mono', monospace; font-weight:700;
    font-size:40px; color:var(--debit); letter-spacing:-0.5px;
  }
  .total-hero .amount.lucro{ color:var(--credit); }
  .total-hero .sub{
    margin-top:2px; font-size:11px; text-transform:uppercase;
    letter-spacing:1.5px; color:var(--ink-faint); font-weight:600;
  }
  .total-hero .sub-gain{
    margin-top:6px; font-size:11.5px; color:var(--ink-soft); font-weight:600;
    display:none;
  }

  .entry-box{
    margin:0 14px; background:var(--white);
    border:1px solid var(--rule-strong); border-radius:14px;
    padding:14px 14px 10px; position:relative; overflow:visible;
  }

  .chip-row{
    display:flex; gap:6px; overflow-x:auto; padding-bottom:8px;
    scrollbar-width:none;
  }
  .chip-row::-webkit-scrollbar{ display:none; }
  .chip{
    flex:0 0 auto; padding:7px 12px; border-radius:20px;
    font-size:12.5px; font-weight:600; white-space:nowrap;
    border:1.5px solid var(--rule-strong); background:var(--paper);
    color:var(--ink-soft); cursor:pointer; touch-action:manipulation;
  }
  .chip.active{ color:var(--white); border-color:transparent; }

  .toggle-row{
    display:flex; gap:8px; margin-top:8px;
  }
  .toggle-group{ display:flex; flex:1; border:1.5px solid var(--rule-strong); border-radius:10px; overflow:hidden; }
  .toggle-btn{
    flex:1; text-align:center; padding:8px 4px; font-size:12px; font-weight:600;
    background:var(--paper); color:var(--ink-soft); cursor:pointer; touch-action:manipulation;
    border-right:1px solid var(--rule-strong);
  }
  .toggle-btn:last-child{ border-right:none; }
  .toggle-btn.active-pay{ background:var(--ink); color:var(--white); }
  .toggle-btn.active-gasto{ background:var(--debit); color:var(--white); }
  .toggle-btn.active-ganho{ background:var(--credit); color:var(--white); }

  .desc-box{ margin-top:10px; }
  .desc-box input{
    width:100%; border:1.5px solid var(--rule-strong); border-radius:10px;
    padding:10px 12px; font-family:'IBM Plex Sans', sans-serif; font-size:14px;
    background:var(--paper); color:var(--ink); outline:none;
  }
  .desc-box input::placeholder{ color:var(--ink-faint); }

  .amount-row{
    display:flex; align-items:center; gap:10px; margin-top:12px; position:relative;
  }
  .amount-display{
    flex:1; height:70px; line-height:70px; padding:0 4px;
    font-family:'IBM Plex Mono', monospace; font-weight:700;
    font-size:34px; color:var(--ink); text-align:right;
    position:relative; overflow:visible;
  }
  .amount-display .fly-money{
    display:inline-block;
  }
  .amount-display.success .fly-money{
    animation: fly-away 1s ease-in forwards;
  }
  @keyframes fly-away{
    0%{ transform:translate(0,0) scale(1); opacity:1; }
    100%{ transform:translate(60px,-140px) scale(1.6); opacity:0; }
  }
  #fireCanvas{
    position:absolute; left:0; right:0; bottom:0;
    width:100%; height:220px;
    pointer-events:none; z-index:5;
    display:none;
  }
  .confirm-arrow{
    flex:0 0 auto; width:52px; height:52px; border-radius:50%;
    background:var(--ink); color:var(--white); border:none;
    font-size:22px; display:flex; align-items:center; justify-content:center;
    cursor:pointer; touch-action:manipulation;
  }
  .confirm-arrow:active{ transform:scale(0.94); }

  .keypad{
    display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin-top:12px;
  }
  .key{
    background:var(--paper); border:1.5px solid var(--rule); border-radius:10px;
    padding:14px 0; text-align:center; font-family:'IBM Plex Mono', monospace;
    font-size:19px; font-weight:600; color:var(--ink); cursor:pointer;
    touch-action:manipulation; -webkit-user-select:none;
  }
  .key:active{ background:var(--rule); }
  .key.back{ color:var(--debit); font-size:16px; }

  .extrato-btn-wrap{ padding:12px 14px 0; }
  .extrato-btn{
    width:100%; background:var(--ink); color:var(--white); border:none;
    border-radius:10px; padding:12px; font-size:13px; font-weight:600;
    letter-spacing:0.5px; cursor:pointer; touch-action:manipulation;
  }

  .ledger{ margin-top:16px; padding:0 14px; }
  .ledger-row{
    display:flex; justify-content:space-between; align-items:flex-start;
    padding:10px 4px; border-bottom:1px solid var(--rule);
    cursor:pointer;
  }
  .ledger-row .left{ flex:1; min-width:0; }
  .ledger-row .top-line{
    display:flex; justify-content:space-between; gap:8px;
    font-family:'IBM Plex Mono', monospace; font-size:13px; font-weight:600;
  }
  .ledger-row .top-line .date{ color:var(--ink-faint); }
  .ledger-row .top-line .val{ color:var(--debit); }
  .ledger-row .top-line .val.ganho{ color:var(--credit); }
  .ledger-row .desc{ font-size:13.5px; color:var(--ink); margin-top:2px; }
  .ledger-row .tags{ margin-top:4px; display:flex; gap:6px; flex-wrap:wrap; }
  .tag{
    font-size:10px; font-weight:700; text-transform:uppercase; letter-spacing:0.5px;
    padding:2px 7px; border-radius:8px; color:var(--white);
  }
  .tag.pay{ background:var(--ink-faint); }
  .tag.ganho-tag{ background:var(--credit); }
  .ledger-empty{ text-align:center; color:var(--ink-faint); font-size:13px; padding:30px 0; }

  .panel-toggle{
    margin:20px 14px 0; text-align:center; font-size:12px; color:var(--ink-faint);
    text-decoration:underline; cursor:pointer;
  }
  .backup-panel{ margin:10px 14px 0; display:none; }
  .backup-panel.open{ display:block; }
  .backup-panel textarea{
    width:100%; height:100px; font-family:'IBM Plex Mono', monospace; font-size:11px;
    border:1px solid var(--rule-strong); border-radius:8px; padding:8px; background:var(--white);
  }
  .backup-panel .row{ display:flex; gap:8px; margin-top:6px; }
  .backup-panel button{
    flex:1; padding:9px; border-radius:8px; border:1px solid var(--rule-strong);
    background:var(--white); font-size:12px; font-weight:600; cursor:pointer;
  }
  .clear-all-btn{
    margin:18px 14px 0; text-align:center; font-size:12px; color:var(--debit);
    text-decoration:underline; cursor:pointer;
  }

  .overlay{
    position:fixed; inset:0; background:rgba(30,42,31,0.55);
    display:none; align-items:flex-end; justify-content:center; z-index:50;
  }
  .overlay.open{ display:flex; }
  .sheet{
    width:100%; max-width:480px; background:var(--paper);
    border-radius:20px 20px 0 0; padding:20px 18px calc(20px + env(safe-area-inset-bottom));
    max-height:85vh; overflow-y:auto;
  }
  .sheet h3{ margin:0 0 14px; font-size:16px; }
  .field{ margin-bottom:12px; }
  .field label{ display:block; font-size:11px; color:var(--ink-soft); margin-bottom:4px; text-transform:uppercase; letter-spacing:0.5px; }
  .field input, .field select{
    width:100%; padding:10px; border:1.5px solid var(--rule-strong); border-radius:8px;
    font-family:'IBM Plex Sans', sans-serif; font-size:14px; background:var(--white);
  }
  .sheet .btn-row{ display:flex; gap:8px; margin-top:16px; }
  .sheet .btn-row button{
    flex:1; padding:12px; border-radius:10px; border:none; font-size:13px; font-weight:600; cursor:pointer;
  }
  .btn-save{ background:var(--ink); color:var(--white); }
  .btn-delete{ background:var(--debit); color:var(--white); }
  .btn-cancel{ background:var(--rule); color:var(--ink); }

  .extrato-text{
    width:100%; height:50vh; font-family:'IBM Plex Mono', monospace; font-size:12px;
    border:1px solid var(--rule-strong); border-radius:8px; padding:10px; background:var(--white);
    white-space:pre; overflow:auto;
  }
</style>
</head>
<body>
<div id="ga-root">

  <div class="month-nav">
    <button id="prevMonth">‹</button>
    <div class="month-label" id="monthLabel">SETEMBRO 2026</div>
    <button id="nextMonth">›</button>
  </div>

  <div class="total-hero">
    <div class="amount" id="totalAmount">R$ 0,00</div>
    <div class="sub" id="totalSub">gasto do mês</div>
    <div class="sub-gain" id="totalGainNote"></div>
  </div>

  <div class="entry-box">
    <div class="chip-row" id="chipRow"></div>

    <div class="toggle-row">
      <div class="toggle-group" id="payToggle"></div>
    </div>
    <div class="toggle-row" id="typeToggleWrap" style="display:none;">
      <div class="toggle-group" id="typeToggle">
        <div class="toggle-btn active-gasto" data-type="gasto">Gasto</div>
        <div class="toggle-btn" data-type="ganho">Ganho</div>
      </div>
    </div>

    <div class="desc-box">
      <input type="text" id="descInput" placeholder="descrição (opcional)">
    </div>

    <div class="amount-row">
      <div class="amount-display" id="amountDisplay"><span class="fly-money">R$ 0,00</span></div>
      <canvas id="fireCanvas"></canvas>
      <button class="confirm-arrow" id="confirmBtn">→</button>
    </div>

    <div class="keypad" id="keypad"></div>
  </div>

  <div class="extrato-btn-wrap">
    <button class="extrato-btn" id="extratoBtn">Ver extrato do mês</button>
  </div>

  <div class="ledger" id="ledger"></div>

  <div class="panel-toggle" id="panelToggle">backup / restaurar dados</div>
  <div class="backup-panel" id="backupPanel">
    <textarea id="backupOut" readonly placeholder="seu backup aparece aqui"></textarea>
    <div class="row">
      <button id="genBackupBtn">Gerar backup</button>
      <button id="copyBackupBtn">Copiar</button>
    </div>
    <textarea id="restoreIn" placeholder="cole aqui o backup pra restaurar" style="margin-top:10px;"></textarea>
    <div class="row">
      <button id="restoreBtn">Restaurar</button>
    </div>
  </div>

  <div class="clear-all-btn" id="clearAllBtn">apagar todos os dados</div>

</div>

<!-- Edit modal -->
<div class="overlay" id="editOverlay">
  <div class="sheet">
    <h3>Editar lançamento</h3>
    <div class="field"><label>Valor</label><input type="text" id="editValor"></div>
    <div class="field"><label>Data</label><input type="date" id="editData"></div>
    <div class="field"><label>Descrição</label><input type="text" id="editDesc"></div>
    <div class="field"><label>Categoria</label><select id="editCategoria"></select></div>
    <div class="field"><label>Pagamento</label><select id="editPagamento"></select></div>
    <div class="field"><label>Tipo</label>
      <select id="editTipo">
        <option value="gasto">Gasto</option>
        <option value="ganho">Ganho</option>
      </select>
    </div>
    <div class="btn-row">
      <button class="btn-delete" id="editDeleteBtn">Excluir</button>
      <button class="btn-cancel" id="editCancelBtn">Cancelar</button>
      <button class="btn-save" id="editSaveBtn">Salvar</button>
    </div>
  </div>
</div>

<!-- Clear confirm modal -->
<div class="overlay" id="clearOverlay">
  <div class="sheet">
    <h3>Apagar tudo?</h3>
    <p style="font-size:13px;color:var(--ink-soft)">Isso vai remover todos os lançamentos salvos neste dispositivo. Não tem como desfazer.</p>
    <div class="btn-row">
      <button class="btn-cancel" id="clearCancelBtn">Cancelar</button>
      <button class="btn-delete" id="clearConfirmBtn">Apagar tudo</button>
    </div>
  </div>
</div>

<!-- Extrato modal -->
<div class="overlay" id="extratoOverlay">
  <div class="sheet">
    <h3 id="extratoTitle">Extrato</h3>
    <textarea class="extrato-text" id="extratoText" readonly></textarea>
    <div class="btn-row">
      <button class="btn-cancel" id="extratoCloseBtn">Fechar</button>
      <button class="btn-save" id="extratoCopyBtn">Copiar</button>
    </div>
  </div>
</div>

<script>
(function(){
  "use strict";

  var STORAGE_KEY = 'gastos_diarios_v1';

  var CATEGORIES = [
    { id:'cachaca',    label:'Cachaça & Cia', keywords:['cachaca','cerveja','bebida','bar ','churrasquinho','tira gosto','petisco'] },
    { id:'mercado',    label:'Mercado',       keywords:['mercado','supermercado','padaria','acougue','hortifruti'] },
    { id:'delivery',   label:'Comida Fora',   keywords:['ifood','restaurante','lanchonete','delivery','quintalcorten','lanche','pizza'] },
    { id:'apostas',    label:'Bets',          keywords:['bet','aposta','hs do brasil'] },
    { id:'lavanderia', label:'Lavanderia',    keywords:['lavanderia','lavagem','lava jato'] },
    { id:'gata',       label:'Gata Vaidosa',  keywords:['salao','unha','cabelo','depila','manicure','estetica'] },
    { id:'coleta',     label:'Coletas',       keywords:['coleta'] },
    { id:'saude',      label:'Saúde',         keywords:['farmacia','remedio','medico','saude','drogaria'] },
    { id:'hydro',      label:'Café Hydro',    keywords:['hydro','elasa','cafe hydro'] },
    { id:'outros',     label:'Outros',        keywords:[] }
  ];

  // ids antigos que já existiram em versões anteriores do app / backups,
  // mapeados para os ids atuais (canônicos) — assim nenhum dado se perde.
  var LEGACY_CATEGORY_MAP = { bets:'apostas', comidafora:'delivery', coletas:'coleta' };
  function mapLegacyCategory(id){
    if(!id) return 'outros';
    if(LEGACY_CATEGORY_MAP[id]) return LEGACY_CATEGORY_MAP[id];
    for(var i=0;i<CATEGORIES.length;i++) if(CATEGORIES[i].id===id) return id;
    return 'outros';
  }

  var CAT_COLOR = {
    cachaca:'var(--cat-cachaca)', mercado:'var(--cat-mercado)', delivery:'var(--cat-comidafora)',
    apostas:'var(--cat-bets)', lavanderia:'var(--cat-lavanderia)', gata:'var(--cat-gata)',
    coleta:'var(--cat-coletas)', saude:'var(--cat-saude)', hydro:'var(--cat-hydro)', outros:'var(--cat-outros)'
  };

  var PAYMENT_TYPES = [
    { id:'pix', label:'Pix' },
    { id:'debito', label:'Débito' },
    { id:'credito', label:'Crédito' }
  ];

  var MONTHS_PT = ['JANEIRO','FEVEREIRO','MARÇO','ABRIL','MAIO','JUNHO','JULHO','AGOSTO','SETEMBRO','OUTUBRO','NOVEMBRO','DEZEMBRO'];

  // ---------- state ----------
  var expenses = [];
  var viewDate = new Date();
  var currentPayment = 'pix';
  var currentType = 'gasto';
  var digitBuffer = '0';
  var selectedCategory = null;
  var categoryManuallySet = false;

  // ---------- helpers ----------
  function normalize(s){
    return (s||'').toString().toLowerCase()
      .normalize('NFD').replace(/[̀-ͯ]/g,'');
  }
  function classify(desc){
    var n = normalize(desc);
    if(!n) return null;
    for(var i=0;i<CATEGORIES.length;i++){
      var c = CATEGORIES[i];
      for(var j=0;j<c.keywords.length;j++){
        if(n.indexOf(c.keywords[j]) !== -1) return c.id;
      }
    }
    return null;
  }
  function catLabel(id){
    for(var i=0;i<CATEGORIES.length;i++) if(CATEGORIES[i].id===id) return CATEGORIES[i].label;
    return id;
  }
  function paymentLabel(id){
    for(var i=0;i<PAYMENT_TYPES.length;i++) if(PAYMENT_TYPES[i].id===id) return PAYMENT_TYPES[i].label;
    return id;
  }
  function formatBRL(n){
    var neg = n < 0;
    n = Math.abs(n);
    var s = n.toFixed(2).replace('.', ',');
    var parts = s.split(',');
    parts[0] = parts[0].replace(/\B(?=(\d{3})+(?!\d))/g, '.');
    return (neg?'-':'') + 'R$ ' + parts.join(',');
  }
  function parseISODate(iso){
    var p = iso.split('-');
    return new Date(parseInt(p[0],10), parseInt(p[1],10)-1, parseInt(p[2],10));
  }
  function todayISO(){
    var d = new Date();
    var m = (d.getMonth()+1).toString().padStart(2,'0');
    var day = d.getDate().toString().padStart(2,'0');
    return d.getFullYear()+'-'+m+'-'+day;
  }
  function uid(){
    return 'e' + Date.now().toString(36) + Math.random().toString(36).slice(2,8);
  }
  function monthKey(d){
    return d.getFullYear() + '-' + (d.getMonth()+1);
  }
  function fmtDateShort(iso){
    var d = parseISODate(iso);
    return d.getDate().toString().padStart(2,'0') + '/' + (d.getMonth()+1).toString().padStart(2,'0');
  }
  function tsToISO(ms){
    var d = new Date(ms);
    var m = (d.getMonth()+1).toString().padStart(2,'0');
    var day = d.getDate().toString().padStart(2,'0');
    return d.getFullYear()+'-'+m+'-'+day;
  }

  // Normaliza um lançamento vindo de qualquer versão anterior do app /
  // backup colado, pro formato atual: {id,date,amount,description,category,paymentType,createdAt,isGain}
  function normalizeEntry(raw){
    raw = raw || {};
    var amount = raw.amount;
    if(typeof amount !== 'number') amount = raw.valor;
    if(typeof amount !== 'number') amount = parseFloat(amount) || 0;

    var createdAt = raw.createdAt;
    if(typeof createdAt !== 'number') createdAt = Date.now();

    var date = raw.date || raw.data || null;
    if(!date) date = tsToISO(createdAt);

    return {
      id: raw.id || uid(),
      date: date,
      amount: amount,
      description: raw.description != null ? raw.description : (raw.descricao || ''),
      category: mapLegacyCategory(raw.category || raw.categoria),
      paymentType: raw.paymentType || raw.pagamento || 'pix',
      createdAt: createdAt,
      isGain: !!raw.isGain
    };
  }

  // ---------- storage ----------
  function loadExpenses(){
    try{
      var raw = window.localStorage.getItem(STORAGE_KEY);
      var parsed = raw ? JSON.parse(raw) : [];
      if(!Array.isArray(parsed)) parsed = [];
      expenses = parsed.map(normalizeEntry);
    }catch(e){
      expenses = [];
    }
  }
  function saveExpenses(){
    try{
      window.localStorage.setItem(STORAGE_KEY, JSON.stringify(expenses));
    }catch(e){
      alert('Não foi possível salvar. Espaço de armazenamento pode estar cheio.');
    }
  }

  // ---------- render: chips / payment toggle ----------
  var chipRow = document.getElementById('chipRow');
  var payToggle = document.getElementById('payToggle');
  var typeToggle = document.getElementById('typeToggle');
  var typeToggleWrap = document.getElementById('typeToggleWrap');

  function resetTypeToggleUI(){
    currentType = 'gasto';
    Array.prototype.forEach.call(typeToggle.children, function(b){
      b.classList.remove('active-gasto','active-ganho');
    });
    typeToggle.children[0].classList.add('active-gasto');
  }

  function updateTypeToggleVisibility(){
    if(selectedCategory === 'apostas'){
      typeToggleWrap.style.display = 'flex';
    } else {
      typeToggleWrap.style.display = 'none';
      resetTypeToggleUI();
    }
  }

  function renderChips(){
    chipRow.innerHTML = '';
    CATEGORIES.forEach(function(c){
      var el = document.createElement('div');
      el.className = 'chip' + (selectedCategory===c.id ? ' active' : '');
      el.textContent = c.label;
      if(selectedCategory===c.id){
        el.style.background = CAT_COLOR[c.id];
      }
      el.addEventListener('click', function(){
        selectedCategory = c.id;
        categoryManuallySet = true;
        renderChips();
        updateTypeToggleVisibility();
      });
      chipRow.appendChild(el);
    });
    updateTypeToggleVisibility();
  }

  function renderPayToggle(){
    payToggle.innerHTML = '';
    PAYMENT_TYPES.forEach(function(p){
      var el = document.createElement('div');
      el.className = 'toggle-btn' + (currentPayment===p.id ? ' active-pay' : '');
      el.textContent = p.label;
      el.addEventListener('click', function(){
        currentPayment = p.id;
        renderPayToggle();
      });
      payToggle.appendChild(el);
    });
  }

  Array.prototype.forEach.call(typeToggle.children, function(el){
    el.addEventListener('click', function(){
      currentType = el.getAttribute('data-type');
      Array.prototype.forEach.call(typeToggle.children, function(b){
        b.classList.remove('active-gasto','active-ganho');
      });
      el.classList.add(currentType==='gasto' ? 'active-gasto' : 'active-ganho');
    });
  });

  // ---------- description auto-suggest ----------
  var descInput = document.getElementById('descInput');
  descInput.addEventListener('input', function(){
    if(categoryManuallySet) return;
    var guess = classify(descInput.value);
    if(guess){
      selectedCategory = guess;
      renderChips();
      updateTypeToggleVisibility();
    }
  });

  // ---------- amount / keypad ----------
  var amountDisplay = document.getElementById('amountDisplay');
  var keypad = document.getElementById('keypad');
  var KEY_LAYOUT = ['1','2','3','4','5','6','7','8','9',',','0','back'];

  function bufferToAmount(){
    var norm = digitBuffer.replace(',', '.');
    var v = parseFloat(norm);
    if(isNaN(v)) v = 0;
    return v;
  }
  function updateAmountDisplay(){
    var span = amountDisplay.querySelector('.fly-money');
    var v = bufferToAmount();
    span.textContent = formatBRL(v);
  }
  function resetBuffer(){
    digitBuffer = '0';
    updateAmountDisplay();
  }

  function renderKeypad(){
    keypad.innerHTML = '';
    KEY_LAYOUT.forEach(function(k){
      var el = document.createElement('div');
      if(k === 'back'){
        el.className = 'key back';
        el.textContent = '⌫';
        el.addEventListener('click', function(){
          if(digitBuffer.length > 1){
            digitBuffer = digitBuffer.slice(0,-1);
          } else {
            digitBuffer = '0';
          }
          updateAmountDisplay();
        });
      } else if(k === ','){
        el.className = 'key';
        el.textContent = ',';
        el.addEventListener('click', function(){
          if(digitBuffer.indexOf(',') === -1){
            digitBuffer += ',';
            updateAmountDisplay();
          }
        });
      } else {
        el.className = 'key';
        el.textContent = k;
        el.addEventListener('click', function(){
          if(digitBuffer === '0'){
            digitBuffer = k;
          } else {
            // limit decimals to 2 digits after comma
            var commaIdx = digitBuffer.indexOf(',');
            if(commaIdx !== -1 && digitBuffer.length - commaIdx > 2) return;
            digitBuffer += k;
          }
          updateAmountDisplay();
        });
      }
      keypad.appendChild(el);
    });
  }

  // ---------- fire + smoke animation ----------
  var fireCanvas = document.getElementById('fireCanvas');
  var fireCtx = fireCanvas.getContext('2d');
  var fireRAF = null;

  function buildFireMask(text){
    // returns array of {x,y} lit pixel offsets per character, relative to that char's box
    var chars = text.split('');
    var results = [];
    var tmp = document.createElement('canvas');
    var size = 40;
    tmp.width = size; tmp.height = size;
    var tctx = tmp.getContext('2d');
    chars.forEach(function(ch){
      tctx.clearRect(0,0,size,size);
      tctx.fillStyle = '#fff';
      tctx.font = 'bold 26px "IBM Plex Mono", monospace';
      tctx.textBaseline = 'middle';
      tctx.textAlign = 'center';
      tctx.fillText(ch, size/2, size/2+2);
      var data = tctx.getImageData(0,0,size,size).data;
      var pts = [];
      for(var y=0;y<size;y+=2){
        for(var x=0;x<size;x+=2){
          var idx = (y*size+x)*4;
          if(data[idx+3] > 100){
            pts.push({x:x-size/2, y:y-size/2});
          }
        }
      }
      results.push(pts.length ? pts : [{x:0,y:0}]);
    });
    return results;
  }

  function fireColorForLife(t){
    // t: 0 (born) -> 1 (dead)
    if(t < 0.25){
      return 'rgba(255,255,210,' + (1-t*0.3) + ')';
    } else if(t < 0.55){
      return 'rgba(255,170,40,' + (0.95-t*0.3) + ')';
    } else if(t < 0.8){
      return 'rgba(220,70,30,' + (0.7-t*0.4) + ')';
    } else {
      var a = Math.max(0,(1-t)*1.2);
      return 'rgba(90,90,90,' + (a*0.35) + ')';
    }
  }

  function playFireAnimation(text, onDone){
    var rect = amountDisplay.getBoundingClientRect();
    var parentRect = amountDisplay.parentElement.getBoundingClientRect();
    var extraH = 150;
    fireCanvas.width = rect.width * devicePixelRatio;
    fireCanvas.height = (rect.height + extraH) * devicePixelRatio;
    fireCanvas.style.width = rect.width + 'px';
    fireCanvas.style.height = (rect.height + extraH) + 'px';
    fireCanvas.style.left = (rect.left - parentRect.left) + 'px';
    fireCanvas.style.top = (rect.top - parentRect.top - extraH) + 'px';
    fireCanvas.style.display = 'block';
    fireCtx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);

    var masks = buildFireMask(text);
    var charW = rect.width / text.length;
    var particles = [];
    var baseY = extraH + rect.height*0.5;

    masks.forEach(function(pts, i){
      var cx = charW*i + charW/2;
      var count = 10;
      for(var n=0;n<count;n++){
        var p = pts[Math.floor(Math.random()*pts.length)];
        particles.push({
          x: cx + p.x*0.5,
          y: baseY + p.y*0.5,
          vx: (Math.random()-0.5)*0.4,
          vy: -1 - Math.random()*1.6,
          size: 3 + Math.random()*4,
          life: 0,
          maxLife: 40 + Math.random()*40,
          delay: Math.random()*15
        });
      }
    });

    var start = null;
    function frame(ts){
      if(!start) start = ts;
      fireCtx.clearRect(0,0,fireCanvas.width, fireCanvas.height);
      var alive = false;
      particles.forEach(function(p){
        if(p.delay > 0){ p.delay--; alive = true; return; }
        p.life++;
        if(p.life > p.maxLife) return;
        alive = true;
        var t = p.life / p.maxLife;
        p.x += p.vx;
        p.y += p.vy * (1 - t*0.3);
        p.vy -= 0.01;
        var col = fireColorForLife(t);
        var sz = p.size * (1 - t*0.4) + t*3;
        fireCtx.beginPath();
        fireCtx.fillStyle = col;
        fireCtx.arc(p.x, p.y, Math.max(0.5,sz), 0, Math.PI*2);
        fireCtx.fill();
      });
      if(alive){
        fireRAF = requestAnimationFrame(frame);
      } else {
        fireCanvas.style.display = 'none';
        fireCtx.clearRect(0,0,fireCanvas.width, fireCanvas.height);
        if(onDone) onDone();
      }
    }
    fireRAF = requestAnimationFrame(frame);
  }

  // ---------- confirm entry ----------
  var confirmBtn = document.getElementById('confirmBtn');
  confirmBtn.addEventListener('click', function(){
    var amount = bufferToAmount();
    if(amount <= 0){
      amountDisplay.style.animation = 'none';
      return;
    }
    var cat = selectedCategory || classify(descInput.value) || 'outros';
    var entry = {
      id: uid(),
      date: todayISO(),
      amount: amount,
      description: descInput.value.trim(),
      category: cat,
      paymentType: currentPayment,
      createdAt: Date.now(),
      isGain: currentType === 'ganho'
    };
    expenses.push(entry);
    saveExpenses();

    var text = formatBRL(amount).replace('R$ ','');
    playFireAnimation(text, function(){});
    amountDisplay.classList.add('success');
    setTimeout(function(){
      amountDisplay.classList.remove('success');
    }, 1000);

    descInput.value = '';
    selectedCategory = null;
    categoryManuallySet = false;
    resetBuffer();
    renderChips();
    render();
  });

  // ---------- month nav ----------
  var monthLabel = document.getElementById('monthLabel');
  document.getElementById('prevMonth').addEventListener('click', function(){
    viewDate.setMonth(viewDate.getMonth()-1);
    render();
  });
  document.getElementById('nextMonth').addEventListener('click', function(){
    viewDate.setMonth(viewDate.getMonth()+1);
    render();
  });

  function monthExpenses(){
    var key = monthKey(viewDate);
    return expenses.filter(function(e){
      return monthKey(parseISODate(e.date)) === key;
    });
  }

  // ---------- ledger + totals ----------
  var totalAmount = document.getElementById('totalAmount');
  var totalSub = document.getElementById('totalSub');
  var totalGainNote = document.getElementById('totalGainNote');
  var ledger = document.getElementById('ledger');

  // Categorias com um resultado próprio de "ganho x gasto" (por enquanto só Bets)
  // ficam de fora do número principal do topo — esse número é só o gasto do
  // dia a dia que passa despercebido, que é o objetivo do app. O resultado
  // dessas categorias aparece à parte, como nota informativa.
  var NET_CATEGORIES = ['apostas'];

  function render(){
    monthLabel.textContent = MONTHS_PT[viewDate.getMonth()] + ' ' + viewDate.getFullYear();
    var list = monthExpenses();

    var gasto = 0;
    var netCat = {}; // por categoria "net": { gasto, ganho }
    NET_CATEGORIES.forEach(function(id){ netCat[id] = { gasto:0, ganho:0 }; });

    list.forEach(function(e){
      if(NET_CATEGORIES.indexOf(e.category) !== -1){
        if(e.isGain) netCat[e.category].ganho += e.amount;
        else netCat[e.category].gasto += e.amount;
      } else if(!e.isGain){
        gasto += e.amount;
      }
    });

    totalAmount.textContent = formatBRL(gasto);
    totalAmount.classList.remove('lucro');
    totalSub.textContent = 'gasto do mês';

    var noteParts = [];
    NET_CATEGORIES.forEach(function(id){
      var b = netCat[id];
      if(b.gasto===0 && b.ganho===0) return;
      var net = b.gasto - b.ganho;
      var label = catLabel(id);
      if(net > 0) noteParts.push(label + ': gasto líquido de ' + formatBRL(net));
      else if(net < 0) noteParts.push(label + ': lucro de ' + formatBRL(Math.abs(net)));
      else noteParts.push(label + ': saldo zerado');
    });
    if(noteParts.length){
      totalGainNote.style.display = 'block';
      totalGainNote.textContent = noteParts.join(' · ') + ' (fora do total acima)';
    } else {
      totalGainNote.style.display = 'none';
    }

    renderLedger(list);
  }

  function renderLedger(list){
    ledger.innerHTML = '';
    if(!list.length){
      var empty = document.createElement('div');
      empty.className = 'ledger-empty';
      empty.textContent = 'nenhum lançamento neste mês';
      ledger.appendChild(empty);
      return;
    }
    var sorted = list.slice().sort(function(a,b){
      if(a.date !== b.date) return a.date < b.date ? 1 : -1;
      return (b.createdAt||0) - (a.createdAt||0);
    });
    sorted.forEach(function(e){
      var row = document.createElement('div');
      row.className = 'ledger-row';
      var sign = e.isGain ? '+ ' : '';
      row.innerHTML =
        '<div class="left">' +
          '<div class="top-line"><span class="date">'+fmtDateShort(e.date)+'</span>' +
          '<span class="val'+(e.isGain?' ganho':'')+'">'+sign+formatBRL(e.amount)+'</span></div>' +
          (e.description ? '<div class="desc">'+escapeHtml(e.description)+'</div>' : '') +
          '<div class="tags">' +
            '<span class="tag" style="background:'+CAT_COLOR[e.category]+'">'+catLabel(e.category)+'</span>' +
            '<span class="tag pay">'+paymentLabel(e.paymentType)+'</span>' +
            (e.isGain ? '<span class="tag ganho-tag">Ganho</span>' : '') +
          '</div>' +
        '</div>';
      row.addEventListener('click', function(){ openEdit(e.id); });
      ledger.appendChild(row);
    });
  }

  function escapeHtml(s){
    var d = document.createElement('div');
    d.textContent = s;
    return d.innerHTML;
  }

  // ---------- edit modal ----------
  var editOverlay = document.getElementById('editOverlay');
  var editValor = document.getElementById('editValor');
  var editData = document.getElementById('editData');
  var editDesc = document.getElementById('editDesc');
  var editCategoria = document.getElementById('editCategoria');
  var editPagamento = document.getElementById('editPagamento');
  var editTipo = document.getElementById('editTipo');
  var editingId = null;

  CATEGORIES.forEach(function(c){
    var o = document.createElement('option');
    o.value = c.id; o.textContent = c.label;
    editCategoria.appendChild(o);
  });
  PAYMENT_TYPES.forEach(function(p){
    var o = document.createElement('option');
    o.value = p.id; o.textContent = p.label;
    editPagamento.appendChild(o);
  });

  function openEdit(id){
    var e = expenses.find(function(x){ return x.id===id; });
    if(!e) return;
    editingId = id;
    editValor.value = e.amount.toFixed(2).replace('.',',');
    editData.value = e.date;
    editDesc.value = e.description || '';
    editCategoria.value = e.category;
    editPagamento.value = e.paymentType;
    editTipo.value = e.isGain ? 'ganho' : 'gasto';
    editOverlay.classList.add('open');
  }
  document.getElementById('editCancelBtn').addEventListener('click', function(){
    editOverlay.classList.remove('open');
  });
  document.getElementById('editSaveBtn').addEventListener('click', function(){
    var e = expenses.find(function(x){ return x.id===editingId; });
    if(!e) return;
    var v = parseFloat(editValor.value.replace(',','.'));
    if(isNaN(v) || v<=0){ alert('Valor inválido'); return; }
    e.amount = v;
    e.date = editData.value || e.date;
    e.description = editDesc.value.trim();
    e.category = editCategoria.value;
    e.paymentType = editPagamento.value;
    e.isGain = editTipo.value === 'ganho';
    saveExpenses();
    editOverlay.classList.remove('open');
    render();
  });
  document.getElementById('editDeleteBtn').addEventListener('click', function(){
    expenses = expenses.filter(function(x){ return x.id!==editingId; });
    saveExpenses();
    editOverlay.classList.remove('open');
    render();
  });

  // ---------- clear all ----------
  var clearOverlay = document.getElementById('clearOverlay');
  document.getElementById('clearAllBtn').addEventListener('click', function(){
    clearOverlay.classList.add('open');
  });
  document.getElementById('clearCancelBtn').addEventListener('click', function(){
    clearOverlay.classList.remove('open');
  });
  document.getElementById('clearConfirmBtn').addEventListener('click', function(){
    expenses = [];
    saveExpenses();
    clearOverlay.classList.remove('open');
    render();
  });

  // ---------- extrato ----------
  var extratoOverlay = document.getElementById('extratoOverlay');
  var extratoText = document.getElementById('extratoText');
  var extratoTitle = document.getElementById('extratoTitle');

  function buildExtrato(){
    var list = monthExpenses();
    var byCat = {};
    CATEGORIES.forEach(function(c){ byCat[c.id] = { gasto:0, ganho:0, items:[] }; });
    list.forEach(function(e){
      if(!byCat[e.category]) byCat[e.category] = { gasto:0, ganho:0, items:[] };
      if(e.isGain) byCat[e.category].ganho += e.amount;
      else byCat[e.category].gasto += e.amount;
      byCat[e.category].items.push(e);
    });

    var byPay = {};
    PAYMENT_TYPES.forEach(function(p){ byPay[p.id] = 0; });
    var totalGasto = 0, totalGanho = 0;

    var lines = [];
    lines.push('EXTRATO — ' + MONTHS_PT[viewDate.getMonth()] + ' ' + viewDate.getFullYear());
    lines.push('');

    CATEGORIES.forEach(function(c){
      var b = byCat[c.id];
      if(!b || (b.gasto===0 && b.ganho===0)) return;
      var net = b.gasto - b.ganho;
      totalGasto += b.gasto;
      totalGanho += b.ganho;
      b.items.forEach(function(e){ byPay[e.paymentType] = (byPay[e.paymentType]||0) + (e.isGain?0:e.amount); });

      lines.push(c.label.toUpperCase());
      if(b.ganho > 0){
        var tag = net < 0 ? 'LUCRO' : 'LÍQUIDO';
        lines.push('  líquido: ' + formatBRL(net) + ' (' + tag + ')');
        lines.push('  gasto: ' + formatBRL(b.gasto) + '  |  ganho: ' + formatBRL(b.ganho));
      } else {
        lines.push('  total: ' + formatBRL(b.gasto));
      }
      lines.push('');
    });

    lines.push('----------------------------------------');
    lines.push('Por forma de pagamento (gastos):');
    PAYMENT_TYPES.forEach(function(p){
      lines.push('  ' + p.label + ': ' + formatBRL(byPay[p.id]||0));
    });
    lines.push('----------------------------------------');
    lines.push('TOTAL GASTO NO MÊS: ' + formatBRL(totalGasto));
    if(totalGanho > 0){
      var netTotal = totalGasto - totalGanho;
      lines.push('GANHOS NO MÊS (ex: resgates de bet): ' + formatBRL(totalGanho));
      if(netTotal >= 0){
        lines.push('Líquido (gasto − ganho): ' + formatBRL(netTotal));
      } else {
        lines.push('Líquido: lucro de ' + formatBRL(Math.abs(netTotal)));
      }
    }

    return lines.join('\n');
  }

  document.getElementById('extratoBtn').addEventListener('click', function(){
    extratoTitle.textContent = 'Extrato — ' + MONTHS_PT[viewDate.getMonth()] + ' ' + viewDate.getFullYear();
    extratoText.value = buildExtrato();
    extratoOverlay.classList.add('open');
  });
  document.getElementById('extratoCloseBtn').addEventListener('click', function(){
    extratoOverlay.classList.remove('open');
  });
  document.getElementById('extratoCopyBtn').addEventListener('click', function(){
    extratoText.select();
    try{ document.execCommand('copy'); }catch(e){}
    if(navigator.clipboard){ navigator.clipboard.writeText(extratoText.value).catch(function(){}); }
  });

  // ---------- backup panel ----------
  var panelToggle = document.getElementById('panelToggle');
  var backupPanel = document.getElementById('backupPanel');
  panelToggle.addEventListener('click', function(){
    backupPanel.classList.toggle('open');
  });
  document.getElementById('genBackupBtn').addEventListener('click', function(){
    document.getElementById('backupOut').value = JSON.stringify(expenses, null, 2);
  });
  document.getElementById('copyBackupBtn').addEventListener('click', function(){
    var ta = document.getElementById('backupOut');
    ta.select();
    try{ document.execCommand('copy'); }catch(e){}
    if(navigator.clipboard){ navigator.clipboard.writeText(ta.value).catch(function(){}); }
  });
  document.getElementById('restoreBtn').addEventListener('click', function(){
    var raw = document.getElementById('restoreIn').value.trim();
    if(!raw) return;
    try{
      var parsedRaw = JSON.parse(raw);
      if(!Array.isArray(parsedRaw)) throw new Error('formato inválido');
      var parsed = parsedRaw.map(normalizeEntry);
      // merge, avoiding duplicate ids
      var existingIds = {};
      expenses.forEach(function(e){ existingIds[e.id] = true; });
      parsed.forEach(function(e){
        if(!existingIds[e.id]){
          expenses.push(e);
        }
      });
      saveExpenses();
      document.getElementById('restoreIn').value = '';
      render();
      alert('Restaurado com sucesso!');
    }catch(err){
      alert('Backup inválido: ' + err.message);
    }
  });

  // ---------- init ----------
  renderChips();
  renderPayToggle();
  renderKeypad();
  loadExpenses();
  render();

  if('serviceWorker' in navigator){
    window.addEventListener('load', function(){
      navigator.serviceWorker.register('./service-worker.js').catch(function(){});
    });
  }
})();
</script>
</body>
