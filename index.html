<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Gastos do dia a dia</title>
<meta name="description" content="Lance seus gastos do dia a dia rapidinho e veja o extrato do mês.">
<meta name="theme-color" content="#1E2A1F">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Gastos">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">

<style>
  html, body { margin: 0; padding: 0; background: #E7EEE1; touch-action: pan-y; overflow-x: hidden; -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
  #ga-root {
    width: 100%;
    --paper: #E7EEE1;
    --ink: #1E2A1F;
    --ink-soft: #5C6B57;
    --ink-faint: #8A9784;
    --rule: #C4D4BB;
    --rule-strong: #9CB491;
    --debit: #9B3A2E;
    --credit: #3E6B4E;
    --white: #FDFCF9;

    --c-cachaca: #8A5A2E;
    --c-hydro: #4A3220;
    --c-mercado: #4E7A5B;
    --c-delivery: #9B3A2E;
    --c-apostas: #7A4E72;
    --c-lavanderia: #3E5B7A;
    --c-gata: #B5657A;
    --c-coleta: #3E7A78;
    --c-saude: #7A7A3E;
    --c-outros: #756D60;

    font-family: 'IBM Plex Sans', -apple-system, sans-serif;
    color: var(--ink);
    background: var(--paper);
    min-height: 100vh;
    box-sizing: border-box;
    padding: max(24px, env(safe-area-inset-top)) 16px calc(36px + env(safe-area-inset-bottom));
    max-width: 460px;
    margin: 0 auto;
  }
  #ga-root * { box-sizing: border-box; }
  #ga-root .mono { font-family: 'IBM Plex Mono', monospace; }

  #ga-root button {
    -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;
  }
  #ga-root .month-nav {
    display: flex; align-items: center; justify-content: center; gap: 14px;
    color: var(--ink-soft); font-size: 0.85rem; margin-bottom: 4px;
  }
  #ga-root .month-nav button { background: none; border: none; color: var(--ink-soft); font-size: 1.1rem; cursor: pointer; padding: 6px 10px; }
  #ga-root .month-label { min-width: 130px; text-align: center; text-transform: capitalize; }

  #ga-root .total-hero { text-align: center; font-size: 2.5rem; font-weight: 600; letter-spacing: -0.02em; margin: 4px 0 16px; }

  #ga-root .quick-feedback {
    font-size: 0.78rem; margin-top: 10px; min-height: 16px; color: var(--ink-soft); text-align: center;
    opacity: 0; transition: opacity 0.25s;
  }
  #ga-root .quick-feedback.show { opacity: 1; }
  #ga-root .quick-feedback.error { color: var(--debit); }

  #ga-root .desc-box {
    display: block; width: 100%; border: 1px solid var(--rule-strong); border-radius: 10px;
    background: var(--white); font-family: inherit; font-size: 0.92rem; color: var(--ink);
    padding: 12px 14px; outline: none; margin: 14px 0; min-height: 46px;
  }
  #ga-root .desc-box::placeholder { color: var(--ink-faint); }
  #ga-root .desc-box:focus { border-color: var(--ink); }

  #ga-root .chip-row { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 12px; }
  #ga-root .chip {
    font-size: 0.76rem; padding: 6px 12px; border-radius: 14px; border: 1px solid var(--rule-strong);
    background: var(--white); color: var(--ink-soft); cursor: pointer; font-family: inherit;
  }
  #ga-root .chip.active { color: var(--white); border-color: transparent; }

  #ga-root .amount-row { display: flex; align-items: center; gap: 10px; margin-bottom: 6px; }
  #ga-root .amount-display {
    flex: 1; min-width: 0; text-align: center; font-size: 2.3rem; font-weight: 600; letter-spacing: -0.02em;
    padding: 12px 0; border-bottom: 2px solid var(--rule-strong);
    transition: color 0.2s, transform 0.2s;
  }
  #ga-root .amount-display.success { color: var(--debit); transform: scale(1.06); }
  #ga-root .fly-money { display: inline-block; animation: flyAway 0.65s ease-out forwards; }
  @keyframes flyAway {
    0%   { opacity: 1; transform: translate(0, 0) rotate(0deg) scale(1); }
    30%  { opacity: 1; transform: translate(6px, -10px) rotate(-8deg) scale(1.15); }
    100% { opacity: 0; transform: translate(60px, -80px) rotate(22deg) scale(1.4); }
  }
  #ga-root .confirm-arrow {
    flex-shrink: 0; width: 52px; height: 52px; border-radius: 12px; border: none;
    background: var(--ink); color: var(--white); font-size: 1.5rem; cursor: pointer;
  }
  #ga-root .confirm-arrow:active { background: var(--ink-soft); }

  #ga-root .keypad { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; margin-top: 14px; min-width: 0; }
  #ga-root .key {
    height: 54px; border-radius: 10px; background: var(--white); border: 1px solid var(--rule-strong);
    font-size: 1.3rem; color: var(--ink); cursor: pointer; font-family: 'IBM Plex Mono', monospace;
  }
  #ga-root .key:active { background: var(--rule); }
  #ga-root .key-back { font-size: 1.1rem; color: var(--ink-soft); }

  #ga-root hr.rule { border: none; border-top: 1px solid var(--rule-strong); margin: 22px 0 6px; }

  #ga-root .payment-toggle { display: flex; gap: 6px; margin-top: 10px; min-width: 0; }
  #ga-root .pay-btn {
    flex: 1; min-width: 0; background: var(--white); border: 1px solid var(--rule-strong); color: var(--ink-soft);
    border-radius: 8px; padding: 6px 2px; font-size: 0.76rem; cursor: pointer; font-family: inherit;
  }
  #ga-root .pay-btn.active { background: var(--ink); color: var(--white); border-color: var(--ink); }

  #ga-root .entry-row {
    display: flex; flex-direction: column; gap: 4px;
    padding: 10px 2px; border-bottom: 1px solid var(--rule); cursor: pointer;
  }
  #ga-root .entry-row:active { background: rgba(0,0,0,0.02); }
  #ga-root .entry-top { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
  #ga-root .entry-date { font-size: 0.75rem; color: var(--ink-faint); white-space: nowrap; }
  #ga-root .entry-desc { font-size: 0.92rem; color: var(--ink); }
  #ga-root .entry-tags { display: flex; gap: 6px; flex-wrap: wrap; }
  #ga-root .tag { font-size: 0.7rem; padding: 2px 8px; border-radius: 10px; line-height: 1.4; }
  #ga-root .tag-cat { color: var(--white); }
  #ga-root .tag-pay { border: 1px solid var(--rule-strong); color: var(--ink-soft); background: transparent; }
  #ga-root .entry-amt { color: var(--debit); font-size: 0.92rem; flex-shrink: 0; }

  #ga-root .empty-state { text-align: center; color: var(--ink-faint); font-size: 0.85rem; padding: 30px 10px; }
  #ga-root .loading-state { text-align: center; color: var(--ink-faint); font-size: 0.85rem; padding: 40px 0; }

  #ga-root .footer-link {
    display: block; text-align: center; margin-top: 26px; font-size: 0.75rem;
    color: var(--ink-faint); background: none; border: none; cursor: pointer; text-decoration: underline;
    text-underline-offset: 2px; width: 100%;
  }

  #ga-root .overlay { display: none; position: fixed; inset: 0; background: rgba(30,42,31,0.45); align-items: flex-end; justify-content: center; z-index: 50; }
  #ga-root .overlay.open { display: flex; }
  #ga-root .modal-sheet { background: var(--white); width: 100%; max-width: 460px; border-radius: 16px 16px 0 0; padding: 20px 18px calc(28px + env(safe-area-inset-bottom)); box-shadow: 0 -4px 24px rgba(0,0,0,0.15); }
  #ga-root .modal-sheet h3 { margin: 0 0 14px; font-size: 1rem; font-weight: 600; }
  #ga-root .field { display: flex; flex-direction: column; gap: 4px; margin-bottom: 10px; }
  #ga-root .field-row { display: flex; gap: 10px; }
  #ga-root .field label { font-size: 0.72rem; color: var(--ink-soft); }
  #ga-root .field input, #ga-root .field select {
    font-family: inherit; font-size: 0.9rem; color: var(--ink);
    border: 1px solid var(--rule-strong); border-radius: 6px; padding: 7px 8px; background: var(--white);
  }
  #ga-root .modal-actions { display: flex; justify-content: space-between; align-items: center; margin-top: 16px; }
  #ga-root .modal-actions .delete-btn { background: none; border: none; color: var(--debit); font-size: 0.85rem; cursor: pointer; }
  #ga-root .modal-actions .right-actions { display: flex; gap: 8px; }
  #ga-root .modal-actions button.cancel { background: none; border: 1px solid var(--rule-strong); color: var(--ink-soft); border-radius: 6px; padding: 8px 14px; font-size: 0.85rem; cursor: pointer; }
  #ga-root .modal-actions button.save { background: var(--ink); color: var(--white); border: none; border-radius: 6px; padding: 8px 14px; font-size: 0.85rem; cursor: pointer; }
  #ga-root .confirm-text { font-size: 0.88rem; color: var(--ink-soft); margin-bottom: 16px; }
</style>
</head>
<body>

<div id="ga-root">
  <div class="month-nav">
    <button id="prevMonth" aria-label="Mês anterior">‹</button>
    <span class="month-label" id="monthLabel">—</span>
    <button id="nextMonth" aria-label="Próximo mês">›</button>
  </div>
  <div class="total-hero mono" id="totalHero">R$ 0,00</div>

  <div class="entry-box">
    <div class="chip-row" id="categoryChips"></div>
    <div class="payment-toggle" id="paymentToggle">
      <button type="button" class="pay-btn active" data-pay="pix">Pix</button>
      <button type="button" class="pay-btn" data-pay="debito">Débito</button>
      <button type="button" class="pay-btn" data-pay="credito">Crédito</button>
    </div>
    <input type="text" id="descInput" class="desc-box" placeholder="descrição (opcional)" autocomplete="off">
    <div class="amount-row">
      <div class="amount-display mono" id="amountDisplay">R$ 0,00</div>
      <button type="button" class="confirm-arrow" id="confirmBtn" aria-label="Adicionar">→</button>
    </div>
    <div class="keypad" id="keypad">
      <button type="button" class="key" data-key="1">1</button>
      <button type="button" class="key" data-key="2">2</button>
      <button type="button" class="key" data-key="3">3</button>
      <button type="button" class="key" data-key="4">4</button>
      <button type="button" class="key" data-key="5">5</button>
      <button type="button" class="key" data-key="6">6</button>
      <button type="button" class="key" data-key="7">7</button>
      <button type="button" class="key" data-key="8">8</button>
      <button type="button" class="key" data-key="9">9</button>
      <button type="button" class="key key-back" data-key="back">⌫</button>
      <button type="button" class="key" data-key="0">0</button>
      <button type="button" class="key" data-key=",">,</button>
    </div>
    <div class="quick-feedback" id="quickFeedback"></div>
  </div>

  <button id="extratoBtn" type="button" style="display:block;margin:14px auto 0;background:none;border:none;color:var(--ink-soft);font-size:0.78rem;cursor:pointer;text-decoration:underline;text-underline-offset:2px;">ver extrato do mês</button>

  <hr class="rule">

  <div class="ledger" id="ledger"><div class="loading-state">Carregando…</div></div>

  <hr class="rule">

  <button class="toggle-details" id="toggleBackup" type="button" style="background:none;border:none;color:var(--ink-faint);font-size:0.78rem;padding:6px 0;cursor:pointer;text-decoration:underline;text-underline-offset:2px;">+ exportar / importar backup</button>
  <div id="backupPanel" style="display:none;margin-top:10px;">
    <div class="field"><label>Seus dados (pra guardar à parte ou levar pra outro aparelho)</label>
      <textarea id="backupText" readonly rows="3" style="font-family:'IBM Plex Mono',monospace;font-size:0.72rem;border:1px solid var(--rule-strong);border-radius:6px;padding:8px;background:var(--white);color:var(--ink-soft);width:100%;resize:vertical;"></textarea>
      <button id="copyBackupBtn" type="button" style="margin-top:6px;background:var(--ink);color:var(--white);border:none;border-radius:6px;padding:7px 12px;font-size:0.78rem;cursor:pointer;align-self:flex-start;">Copiar</button>
      <span id="copyFeedback" style="font-size:0.72rem;color:var(--ink-soft);margin-left:8px;"></span>
    </div>
    <div class="field"><label>Colar backup pra restaurar</label>
      <textarea id="restoreText" rows="3" placeholder="cole aqui o texto salvo" style="font-family:'IBM Plex Mono',monospace;font-size:0.72rem;border:1px solid var(--rule-strong);border-radius:6px;padding:8px;background:var(--white);color:var(--ink);width:100%;resize:vertical;"></textarea>
      <button id="restoreBtn" type="button" style="margin-top:6px;background:var(--ink);color:var(--white);border:none;border-radius:6px;padding:7px 12px;font-size:0.78rem;cursor:pointer;align-self:flex-start;">Carregar backup</button>
      <span id="restoreFeedback" style="font-size:0.72rem;color:var(--ink-soft);margin-left:8px;"></span>
    </div>
  </div>

  <button class="footer-link" id="clearAllBtn" type="button">Limpar todos os dados</button>
</div>

<div class="overlay" id="editOverlay">
  <div class="modal-sheet">
    <h3>Editar gasto</h3>
    <div class="field-row">
      <div class="field" style="flex:1"><label for="eValor">Valor (R$)</label><input type="number" id="eValor" step="0.01" min="0" inputmode="decimal"></div>
      <div class="field" style="flex:1"><label for="eData">Data</label><input type="date" id="eData"></div>
    </div>
    <div class="field"><label for="eDescricao">Descrição</label><input type="text" id="eDescricao"></div>
    <div class="field-row">
      <div class="field" style="flex:1"><label for="eCategoria">Categoria</label><select id="eCategoria"></select></div>
      <div class="field" style="flex:1"><label for="ePagamento">Pagamento</label><select id="ePagamento"></select></div>
    </div>
    <div class="modal-actions">
      <button class="delete-btn" id="eDeleteBtn" type="button">Excluir</button>
      <div class="right-actions">
        <button class="cancel" id="eCancelBtn" type="button">Cancelar</button>
        <button class="save" id="eSaveBtn" type="button">Salvar</button>
      </div>
    </div>
  </div>
</div>

<div class="overlay" id="clearOverlay">
  <div class="modal-sheet">
    <h3>Limpar todos os dados</h3>
    <p class="confirm-text">Isso apaga permanentemente todos os gastos salvos neste aparelho. Não dá pra desfazer.</p>
    <div class="modal-actions">
      <span></span>
      <div class="right-actions">
        <button class="cancel" id="cCancelBtn" type="button">Cancelar</button>
        <button class="save" id="cConfirmBtn" type="button" style="background: var(--debit);">Apagar tudo</button>
      </div>
    </div>
  </div>
</div>

<div class="overlay" id="extratoOverlay">
  <div class="modal-sheet">
    <h3 id="extratoTitle">Extrato do mês</h3>
    <textarea id="extratoText" readonly rows="12" style="font-family:'IBM Plex Mono',monospace;font-size:0.76rem;line-height:1.5;border:1px solid var(--rule-strong);border-radius:6px;padding:10px;background:var(--white);color:var(--ink);width:100%;resize:vertical;white-space:pre;"></textarea>
    <div class="modal-actions">
      <span id="extratoCopyFeedback" style="font-size:0.75rem;color:var(--ink-soft);"></span>
      <div class="right-actions">
        <button class="cancel" id="extratoCloseBtn" type="button">Fechar</button>
        <button class="save" id="extratoCopyBtn" type="button">Copiar</button>
      </div>
    </div>
  </div>
</div>

<script>
(function () {
  const CATEGORIES = [
    { id: 'cachaca', label: 'Cachaça & Cia', keywords: ['cachaca','cerveja','bebida','birita','chopp','vodka','whisky','drink','boteco','tira gosto','tiragosto','churrasco','churrasquinho','petisco','bar'] },
    { id: 'hydro', label: 'Café Hydro', keywords: ['hydro','cafe hydro','cafe'] },
    { id: 'mercado', label: 'Mercado', keywords: ['mercado','supermercado','feira','hortifruti','acougue','padaria','hortifruti'] },
    { id: 'delivery', label: 'Comida Fora', keywords: ['restaurante','lanchonete','ifood','delivery','lanche','hamburgueria','pizza','pizzaria','rappi'] },
    { id: 'apostas', label: 'Bets', keywords: ['aposta','bet','loteria','jogo do bicho','rifa'] },
    { id: 'lavanderia', label: 'Lavanderia', keywords: ['lavanderia','lavagem de roupa','tinturaria'] },
    { id: 'gata', label: 'Gata Vaidosa', keywords: ['depilacao','cabelo','salao','unha','manicure','pedicure','estetica','sobrancelha','maquiagem'] },
    { id: 'coleta', label: 'Coletas', keywords: ['coleta'] },
    { id: 'saude', label: 'Saúde', keywords: ['farmacia','remedio','medico','consulta','dentista','plano de saude','academia'] },
    { id: 'outros', label: 'Outros', keywords: [] }
  ];
  const CAT_COLOR = { cachaca: 'var(--c-cachaca)', hydro: 'var(--c-hydro)', mercado: 'var(--c-mercado)', delivery: 'var(--c-delivery)', apostas: 'var(--c-apostas)', lavanderia: 'var(--c-lavanderia)', gata: 'var(--c-gata)', coleta: 'var(--c-coleta)', saude: 'var(--c-saude)', outros: 'var(--c-outros)' };
  const PAYMENT_TYPES = [
    { id: 'pix', label: 'Pix' },
    { id: 'debito', label: 'Débito' },
    { id: 'credito', label: 'Crédito' }
  ];
  const STORAGE_KEY = 'gastos_diarios_v1';

  let expenses = [];
  let viewDate = new Date(); viewDate.setDate(1);
  let currentPayment = 'pix';

  const $ = (id) => document.getElementById(id);

  function normalize(s) { return s.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, ''); }
  function classify(desc) {
    const n = normalize(desc);
    for (const cat of CATEGORIES) { if (cat.id === 'outros') continue; if (cat.keywords.some(k => n.includes(k))) return cat.id; }
    return 'outros';
  }
  function catLabel(id) { const c = CATEGORIES.find(c => c.id === id); return c ? c.label : 'Outros'; }
  function paymentLabel(id) { const p = PAYMENT_TYPES.find(p => p.id === id); return p ? p.label : 'Pix'; }
  function extractPayment(desc) {
    const m = desc.match(/\b(pix|d[ée]bito|cr[ée]dito)\b/i);
    if (!m) return { payment: null, desc };
    const word = normalize(m[1]);
    const type = word.indexOf('cred') !== -1 ? 'credito' : (word.indexOf('deb') !== -1 ? 'debito' : 'pix');
    const cleaned = (desc.slice(0, m.index) + desc.slice(m.index + m[0].length)).trim().replace(/^[\s,.-]+|[\s,.-]+$/g, '');
    return { payment: type, desc: cleaned };
  }
  function formatBRL(n) { return 'R$ ' + n.toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 }); }
  function parseISODate(iso) { const [y, m, d] = iso.split('-').map(Number); return new Date(y, m - 1, d); }
  function todayISO() { const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }
  function uid() { return (crypto.randomUUID ? crypto.randomUUID() : 'e' + Date.now() + Math.random().toString(16).slice(2)); }
  function monthKey(d) { return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0'); }

  function populateCategorySelect(sel) {
    sel.innerHTML = '';
    CATEGORIES.forEach(c => { const opt = document.createElement('option'); opt.value = c.id; opt.textContent = c.label; sel.appendChild(opt); });
  }
  populateCategorySelect($('eCategoria'));
  function populatePaymentSelect(sel) {
    sel.innerHTML = '';
    PAYMENT_TYPES.forEach(p => { const opt = document.createElement('option'); opt.value = p.id; opt.textContent = p.label; sel.appendChild(opt); });
  }
  populatePaymentSelect($('ePagamento'));

  document.querySelectorAll('#paymentToggle .pay-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      currentPayment = btn.dataset.pay;
      document.querySelectorAll('#paymentToggle .pay-btn').forEach(b => b.classList.toggle('active', b === btn));
    });
  });

  // ---- teclado numérico (sem precisar do teclado do telefone) ----
  let digitBuffer = '';
  let selectedCategory = 'outros';
  let categoryManuallySet = false;

  function bufferToAmount() { return parseFloat((digitBuffer || '0').replace(',', '.')) || 0; }
  function updateAmountDisplay() { $('amountDisplay').textContent = digitBuffer ? ('R$ ' + digitBuffer) : 'R$ 0,00'; }

  function renderCategoryChips() {
    const box = $('categoryChips');
    box.innerHTML = '';
    CATEGORIES.forEach(c => {
      const btn = document.createElement('button');
      btn.type = 'button';
      const active = c.id === selectedCategory;
      btn.className = 'chip' + (active ? ' active' : '');
      btn.textContent = c.label;
      if (active) btn.style.background = CAT_COLOR[c.id];
      btn.addEventListener('click', () => {
        selectedCategory = c.id;
        categoryManuallySet = true;
        renderCategoryChips();
      });
      box.appendChild(btn);
    });
  }
  renderCategoryChips();
  updateAmountDisplay();

  $('descInput').addEventListener('input', (e) => {
    if (categoryManuallySet) return;
    const val = e.target.value.trim();
    if (!val) return;
    const guess = classify(val);
    if (guess !== selectedCategory) { selectedCategory = guess; renderCategoryChips(); }
  });

  function confirmEntry() {
    const amount = bufferToAmount();
    const fb = $('quickFeedback');
    if (!amount || amount <= 0) {
      fb.textContent = 'Digite um valor primeiro.';
      fb.className = 'quick-feedback error show';
      setTimeout(() => { fb.className = 'quick-feedback'; }, 2000);
      return;
    }
    const description = $('descInput').value.trim();
    const category = selectedCategory;
    const paymentType = currentPayment;
    const entry = { id: uid(), date: todayISO(), amount, category, paymentType, description: description || catLabel(category), createdAt: Date.now() };
    expenses.push(entry);
    saveExpenses();
    viewDate = new Date(); viewDate.setDate(1);
    render();
    const amountEl = $('amountDisplay');
    amountEl.innerHTML = '<span class="fly-money">💸</span>';
    amountEl.classList.add('success');
    digitBuffer = '';
    $('descInput').value = '';
    categoryManuallySet = false;
    fb.textContent = `Lançado em ${catLabel(category)} · ${paymentLabel(paymentType)}.`;
    fb.className = 'quick-feedback show';
    setTimeout(() => {
      amountEl.classList.remove('success');
      updateAmountDisplay();
    }, 650);
    setTimeout(() => { fb.className = 'quick-feedback'; }, 2200);
  }

  document.querySelectorAll('#keypad .key').forEach(btn => {
    btn.addEventListener('click', () => {
      const key = btn.dataset.key;
      if (key === 'back') {
        digitBuffer = digitBuffer.slice(0, -1);
      } else if (key === ',') {
        if (digitBuffer === '') digitBuffer = '0,';
        else if (!digitBuffer.includes(',')) digitBuffer += ',';
      } else {
        if (digitBuffer.includes(',')) {
          const decimals = digitBuffer.split(',')[1] || '';
          if (decimals.length >= 2) return;
        } else if (digitBuffer.replace(',', '').length >= 7) {
          return;
        }
        digitBuffer += key;
      }
      updateAmountDisplay();
    });
  });

  $('confirmBtn').addEventListener('click', confirmEntry);

  // ---- persistência real via localStorage (funciona porque aqui fora do Claude não tem o sandbox que bloqueava) ----
  function loadExpenses() {
    try {
      const raw = window.localStorage.getItem(STORAGE_KEY);
      expenses = raw ? JSON.parse(raw) : [];
    } catch (e) {
      console.error('Erro ao carregar dados salvos:', e);
      expenses = [];
    }
    render();
  }
  function saveExpenses() {
    try {
      window.localStorage.setItem(STORAGE_KEY, JSON.stringify(expenses));
    } catch (e) {
      console.error('Erro ao salvar:', e);
    }
    updateBackupText();
  }
  function updateBackupText() {
    const el = $('backupText');
    if (el) el.value = JSON.stringify(expenses);
  }

  function entriesForViewMonth() {
    const key = monthKey(viewDate);
    return expenses.filter(e => e.date.slice(0, 7) === key).sort((a, b) => b.date.localeCompare(a.date) || (b.createdAt || 0) - (a.createdAt || 0));
  }

  function render() {
    $('monthLabel').textContent = viewDate.toLocaleDateString('pt-BR', { month: 'long', year: 'numeric' });
    const monthEntries = entriesForViewMonth();
    const total = monthEntries.reduce((s, e) => s + e.amount, 0);
    $('totalHero').textContent = formatBRL(total);
    renderLedger(monthEntries);
  }

  function renderLedger(monthEntries) {
    const ledger = $('ledger');
    ledger.innerHTML = '';
    if (monthEntries.length === 0) {
      ledger.innerHTML = '<div class="empty-state">Nada lançado neste mês ainda.<br>Digite acima pra começar — tipo "12 cafezinho".</div>';
      return;
    }
    monthEntries.forEach(e => {
      const row = document.createElement('div');
      row.className = 'entry-row';
      const dateLabel = parseISODate(e.date).toLocaleDateString('pt-BR', { day: '2-digit', month: '2-digit' });
      row.innerHTML = `
        <div class="entry-top">
          <span class="entry-date">${dateLabel}</span>
          <span class="entry-amt mono">${formatBRL(e.amount)}</span>
        </div>
        <div class="entry-desc">${escapeHtml(e.description || catLabel(e.category))}</div>
        <div class="entry-tags">
          <span class="tag tag-cat" style="background:${CAT_COLOR[e.category]}">${catLabel(e.category)}</span>
          <span class="tag tag-pay">${paymentLabel(e.paymentType)}</span>
        </div>
      `;
      row.addEventListener('click', () => openEditModal(e.id));
      ledger.appendChild(row);
    });
  }

  function escapeHtml(s) { return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

  $('prevMonth').addEventListener('click', () => { viewDate.setMonth(viewDate.getMonth() - 1); render(); });
  $('nextMonth').addEventListener('click', () => { viewDate.setMonth(viewDate.getMonth() + 1); render(); });

  let editingId = null;
  function openEditModal(id) {
    const e = expenses.find(x => x.id === id);
    if (!e) return;
    editingId = id;
    $('eValor').value = e.amount;
    $('eData').value = e.date;
    $('eDescricao').value = e.description;
    $('eCategoria').value = e.category;
    $('ePagamento').value = e.paymentType || 'pix';
    $('editOverlay').classList.add('open');
  }
  $('eCancelBtn').addEventListener('click', () => { $('editOverlay').classList.remove('open'); editingId = null; });
  $('eSaveBtn').addEventListener('click', () => {
    const e = expenses.find(x => x.id === editingId);
    if (!e) return;
    const valor = parseFloat($('eValor').value);
    if (!valor || valor <= 0) { $('eValor').focus(); return; }
    e.amount = valor; e.date = $('eData').value || e.date;
    e.description = $('eDescricao').value.trim() || catLabel($('eCategoria').value);
    e.category = $('eCategoria').value;
    e.paymentType = $('ePagamento').value;
    saveExpenses();
    $('editOverlay').classList.remove('open'); editingId = null;
    render();
  });
  $('eDeleteBtn').addEventListener('click', () => {
    expenses = expenses.filter(x => x.id !== editingId);
    saveExpenses();
    $('editOverlay').classList.remove('open'); editingId = null;
    render();
  });

  $('clearAllBtn').addEventListener('click', () => $('clearOverlay').classList.add('open'));
  $('cCancelBtn').addEventListener('click', () => $('clearOverlay').classList.remove('open'));
  $('cConfirmBtn').addEventListener('click', () => {
    expenses = [];
    saveExpenses();
    $('clearOverlay').classList.remove('open');
    render();
  });

  function buildExtrato(monthEntries, monthLabel) {
    const total = monthEntries.reduce((s, e) => s + e.amount, 0);
    let lines = [];
    lines.push('EXTRATO — ' + monthLabel.toUpperCase());
    lines.push('Total do mês: ' + formatBRL(total));
    lines.push('');
    const byCat = {};
    monthEntries.forEach(e => { (byCat[e.category] = byCat[e.category] || []).push(e); });
    const catIds = Object.keys(byCat).sort((a, b) => {
      const ta = byCat[a].reduce((s, e) => s + e.amount, 0);
      const tb = byCat[b].reduce((s, e) => s + e.amount, 0);
      return tb - ta;
    });
    catIds.forEach(catId => {
      const items = byCat[catId].slice().sort((a, b) => a.date.localeCompare(b.date));
      const subtotal = items.reduce((s, e) => s + e.amount, 0);
      lines.push(catLabel(catId) + ' — ' + formatBRL(subtotal));
      items.forEach(e => {
        const d = parseISODate(e.date).toLocaleDateString('pt-BR', { day: '2-digit', month: '2-digit' });
        const desc = (e.description || '').padEnd(22, ' ').slice(0, 22);
        const pay = ('[' + paymentLabel(e.paymentType) + ']').padEnd(10, ' ');
        lines.push('  ' + d + '  ' + desc + '  ' + pay + '  ' + formatBRL(e.amount));
      });
      lines.push('');
    });
    lines.push('Por forma de pagamento:');
    PAYMENT_TYPES.forEach(p => {
      const subtotal = monthEntries.filter(e => (e.paymentType || 'pix') === p.id).reduce((s, e) => s + e.amount, 0);
      lines.push('  ' + p.label.padEnd(10, ' ') + formatBRL(subtotal));
    });
    return lines.join('\n').trim();
  }

  $('extratoBtn').addEventListener('click', () => {
    const monthEntries = entriesForViewMonth();
    const monthLabel = viewDate.toLocaleDateString('pt-BR', { month: 'long', year: 'numeric' });
    $('extratoTitle').textContent = 'Extrato de ' + monthLabel;
    $('extratoText').value = monthEntries.length ? buildExtrato(monthEntries, monthLabel) : 'Nenhum gasto lançado neste mês ainda.';
    $('extratoOverlay').classList.add('open');
  });
  $('extratoCloseBtn').addEventListener('click', () => $('extratoOverlay').classList.remove('open'));
  $('extratoCopyBtn').addEventListener('click', async () => {
    const el = $('extratoText');
    el.focus(); el.select();
    const fb = $('extratoCopyFeedback');
    try {
      await navigator.clipboard.writeText(el.value);
      fb.textContent = 'Copiado!';
    } catch (e) {
      fb.textContent = 'Selecionado — use Ctrl/Cmd+C.';
    }
    setTimeout(() => { fb.textContent = ''; }, 2500);
  });

  $('toggleBackup').addEventListener('click', () => {
    const panel = $('backupPanel');
    const open = panel.style.display !== 'none';
    panel.style.display = open ? 'none' : 'block';
    $('toggleBackup').textContent = open ? '+ exportar / importar backup' : '- ocultar backup';
    if (!open) updateBackupText();
  });

  $('copyBackupBtn').addEventListener('click', async () => {
    const el = $('backupText');
    updateBackupText();
    el.focus(); el.select();
    const fb = $('copyFeedback');
    try {
      await navigator.clipboard.writeText(el.value);
      fb.textContent = 'Copiado!';
    } catch (e) {
      fb.textContent = 'Selecionado — use Ctrl/Cmd+C pra copiar.';
    }
    setTimeout(() => { fb.textContent = ''; }, 2500);
  });

  $('restoreBtn').addEventListener('click', () => {
    const fb = $('restoreFeedback');
    const raw = $('restoreText').value.trim();
    if (!raw) return;
    try {
      const parsed = JSON.parse(raw);
      if (!Array.isArray(parsed)) throw new Error('formato invalido');
      expenses = parsed;
      saveExpenses();
      render();
      fb.textContent = 'Restaurado!';
      $('restoreText').value = '';
    } catch (e) {
      fb.textContent = 'Não consegui ler esse texto. Confira se colou certinho.';
    }
    setTimeout(() => { fb.textContent = ''; }, 3000);
  });

  loadExpenses();
})();

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('service-worker.js').catch(function (e) {
      console.error('Falha ao registrar service worker:', e);
    });
  });
}
</script>
</body>
</html>
